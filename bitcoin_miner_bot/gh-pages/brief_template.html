<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{HEADLINE}} - SHA256.news</title>
    <meta name="description" content="Bitcoin mining news brief for {{DATE}}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            background: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .brief {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .header {
            border-bottom: 3px solid #f7931a;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .date {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #333;
            margin: 10px 0;
            font-size: 2.2em;
        }
        
        .summary {
            font-size: 1.15em;
            color: #555;
            font-style: italic;
            margin: 20px 0;
            padding: 20px;
            background: #f9f9f9;
            border-left: 4px solid #f7931a;
            border-radius: 4px;
        }
        
        .section {
            margin: 30px 0;
        }
        
        .section h2 {
            color: #f7931a;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        .article {
            margin: 20px 0;
            padding: 20px;
            background: #fafafa;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        
        .article:hover {
            transform: translateX(5px);
            background: #f5f5f5;
        }
        
        .article h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 1.2em;
        }
        
        .article a {
            color: #f7931a;
            text-decoration: none;
            font-weight: 600;
        }
        
        .article a:hover {
            text-decoration: underline;
        }
        
        .article p {
            color: #666;
            margin: 10px 0;
        }
        
        .article small {
            color: #999;
            font-size: 0.85em;
        }
        
        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #eee;
            text-align: center;
            color: #666;
        }
        
        .footer a {
            color: #f7931a;
            text-decoration: none;
            font-weight: 600;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #f7931a;
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Back to Home</a>
        
        <div class="brief">
            <div class="header">
                <div class="date">{{DATE}}</div>
                <h1>{{HEADLINE}}</h1>
            </div>
            
            <div class="summary">
                {{SUMMARY}}
            </div>
            
            {{CONTENT}}
            
            <div class="footer">
                <p><strong>SHA256.news</strong> - Bitcoin Mining News Aggregator</p>
                <p style="margin-top: 10px;">
                    <a href="../index.html">← Back to Home</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
