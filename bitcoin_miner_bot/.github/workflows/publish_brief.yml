name: Publish Daily Brief

on:
  schedule:
    # Run daily at 8 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  publish-brief:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('bitcoin_miner_bot/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          cd bitcoin_miner_bot
          pip install -r requirements.txt
      
      - name: Generate daily brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_REGISTRY_API_KEY: ${{ secrets.EVENT_REGISTRY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          cd bitcoin_miner_bot
          python -c "
          from daily_brief_generator import DailyBriefGenerator
          from news_processor import NewsProcessor
          from github_manager import GitHubManager
          from dotenv import load_dotenv
          import logging
          
          logging.basicConfig(level=logging.INFO)
          load_dotenv()
          
          # Generate brief
          news_processor = NewsProcessor()
          brief_generator = DailyBriefGenerator()
          github_manager = GitHubManager()
          
          # Fetch articles from last 24 hours
          articles = news_processor.fetch_articles(max_articles=50)
          
          if articles:
              brief_meta = brief_generator.generate_brief(articles)
              if brief_meta:
                  # Update briefs index
                  recent_briefs = brief_generator.get_recent_briefs(limit=20)
                  github_manager.update_briefs_index(recent_briefs)
                  print(f'Generated brief: {brief_meta[\"filename\"]}')
              else:
                  print('Failed to generate brief')
          else:
              print('No articles found for brief')
          "
      
      - name: Commit and push brief
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bitcoin_miner_bot/gh-pages/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Publish daily brief [skip ci]" && git push)
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bitcoin_miner_bot/gh-pages
          publish_branch: gh-pages
